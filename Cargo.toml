[package]
name = "muxget"
version = "0.1.0"
edition = "2021"
description = "Terminal download manager driving aria2c and yt-dlp"
license = "MIT"
readme = "README.md"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"

# aria2c and yt-dlp are the backends; muxget runs without either installed,
# it just cannot download until one is.
[package.metadata.deb]
recommends = "aria2, yt-dlp"
section = "net"

[package.metadata.generate-rpm]
# `--target` rewrites this prefix to the cross-built path.
assets = [
    { source = "target/release/muxget", dest = "/usr/bin/muxget", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/muxget/README.md", doc = true, mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/muxget/LICENSE", mode = "644" },
]

[package.metadata.generate-rpm.recommends]
aria2 = "*"
yt-dlp = "*"

[lib]
path = "src/lib.rs"

[[bin]]
name = "muxget"
path = "src/main.rs"

# tests/ mirrors src/ paths; cargo only auto-discovers tests/*.rs, so declare them.
[[test]]
name = "utils_parse"
path = "tests/utils/parse.rs"

[[test]]
name = "utils_edit"
path = "tests/utils/edit.rs"

[[test]]
name = "utils_args"
path = "tests/utils/args.rs"

[[test]]
name = "models_backend"
path = "tests/models/backend.rs"

[[test]]
name = "models_channel"
path = "tests/models/channel.rs"

[[test]]
name = "models_crawl"
path = "tests/models/crawl.rs"

[[test]]
