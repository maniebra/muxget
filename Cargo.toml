[package]
name = "muxget"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"

[lib]
path = "src/lib.rs"

[[bin]]
name = "muxget"
path = "src/main.rs"

# tests/ mirrors src/ paths; cargo only auto-discovers tests/*.rs, so declare them.
[[test]]
name = "utils_parse"
path = "tests/utils/parse.rs"

[[test]]
name = "utils_args"
path = "tests/utils/args.rs"

[[test]]
name = "models_backend"
path = "tests/models/backend.rs"

[[test]]
name = "models_ytdlp"
path = "tests/models/ytdlp.rs"

[[test]]
name = "controllers_downloads"
path = "tests/controllers/downloads.rs"

[[test]]
name = "controllers_queues"
path = "tests/controllers/queues.rs"

[[test]]
name = "controllers_keys"
path = "tests/controllers/keys.rs"

[[test]]
name = "controllers_settings"
path = "tests/controllers/settings.rs"

[[test]]
name = "controllers_options"
path = "tests/controllers/options.rs"

[[test]]
name = "views_theme"
path = "tests/views/theme.rs"
